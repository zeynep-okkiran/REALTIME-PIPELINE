services:
  # --------------------------------------------------------------------------
  # Kafka — KRaft mode (no Zookeeper), single node.
  #
  # Two listeners are defined on purpose:
  #   INTERNAL (kafka:9092)      -> other containers (spark, producer, kafka-ui)
  #   EXTERNAL (localhost:29092) -> dev scripts running on the host
  # A single listener would not let the host connect: the broker advertises its
  # own address, so the client would try to resolve "kafka:9092" and hang.
  # --------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.9.1
    container_name: rtp-kafka
    ports:
      - "${KAFKA_EXTERNAL_PORT}:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Single node, so every internal topic uses replication factor 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # The kafka-init service creates the topic with a controlled partition count
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # One-shot service that creates the topic idempotently (--if-not-exists).
  # Runs on every "docker compose up" and leaves an existing topic untouched,
  # so the topic does not have to be recreated by hand after "down -v".
  # --------------------------------------------------------------------------
  kafka-init:
    image: apache/kafka:3.9.1
    container_name: rtp-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-euc"]
    # command is given as a LIST (single element): when given as a string,
    # Compose splits it into shell-like words, so "sh -c" takes only the first
    # word as the script and binds the rest to $0/$1 -> script runs with no args.
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic ${KAFKA_TOPIC} --partitions ${KAFKA_PARTITIONS} --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe --topic ${KAFKA_TOPIC}
    restart: "no"

  # --------------------------------------------------------------------------
  # Producer — polls the Binance REST API and publishes trades to Kafka.
  # No volumes: it holds no state on disk. The fromId watermark lives in memory
  # and is reseeded from the latest trade on start, so a restart resumes live
  # rather than replaying history.
  # --------------------------------------------------------------------------
  producer:
    build:
      context: ./producer
    image: rtp-producer:1.0
    container_name: rtp-producer
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      # The INTERNAL listener. ${KAFKA_BOOTSTRAP} in .env points at
      # localhost:29092, which is only meaningful for a producer run on the host.
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      SYMBOLS: ${SYMBOLS}
      POLL_INTERVAL_SEC: ${POLL_INTERVAL_SEC}
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Spark Structured Streaming — reads the topic, aggregates 5-second windows
  # and writes them to Mongo and to output/live_ohlc.jsonl.
  #
  # Spark runs in a container rather than on the host on purpose: PySpark
  # checkpointing on Windows needs winutils.exe/hadoop.dll, which would also
  # break the "copy the folder to Linux and run" goal.
  # --------------------------------------------------------------------------
  spark:
    # Built rather than pulled: the stock image has no pymongo. See spark/Dockerfile.
    build:
      context: ./spark
    image: rtp-spark:4.0.0
    container_name: rtp-spark
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      # Explicitly the INTERNAL listener, NOT ${KAFKA_BOOTSTRAP}: that variable
      # points at localhost:29092 for the producer running on the host.
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      # Container-internal Mongo port; 27018 is only the host mapping
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: ${MONGO_DB}
      MONGO_COLLECTION: ${MONGO_COLLECTION}
      OUTPUT_PATH: /app/output/live_ohlc.jsonl
      CHECKPOINT_PATH: /checkpoint/ohlc
    ports:
      # Spark's own web UI: micro-batch durations, input rate, query plan.
      # Only served while the driver is running.
      - "${SPARK_UI_PORT}:4040"
    volumes:
      # Job source: editing it locally only needs "docker compose restart spark"
      - ./spark:/app
      # Ivy cache for --packages, so the connector jars are downloaded once
      - ./.ivy:/opt/spark/.ivy2
      # Checkpoint is a named volume, not a bind mount, on purpose: Spark
      # rewrites offset/state files on every micro-batch and doing that across
      # the Windows filesystem boundary pushed batches from 5s to 8-13s. The
      # checkpoint is opaque internal state, so nothing needs to read it from
      # the host. The output file below stays a bind mount - it is the point.
      - spark-checkpoint:/checkpoint
      - ./output:/app/output
    # Given as a LIST for the same reason as kafka-init: a string command would
    # be re-split by Compose.
    command:
      - /opt/spark/bin/spark-submit
      # 4 worker threads: with 2 the micro-batch consistently overran the
      # 5-second trigger, leaving no headroom for the sinks added in step 5.
      - --master
      - local[4]
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.13:4.0.0
      # Pin the Ivy home so it resolves to the bind-mounted cache above
      - --conf
      - spark.jars.ivy=/opt/spark/.ivy2
      # Shuffle partitions default to 200, which meant every micro-batch spawned
      # a 200-task stage to produce one row per symbol. 8 leaves room for more
      # symbols while staying close to the 4 available threads.
      - --conf
      - spark.sql.shuffle.partitions=8
      - /app/stream_job.py
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # MongoDB — the NoSQL sink of the pipeline.
  # Host port is 27018: the machine's native MongoDB 8.2 service already owns
  # 27017 and we leave it completely alone.
  # --------------------------------------------------------------------------
  mongo:
    image: mongo:8
    container_name: rtp-mongo
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1})"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Kafka UI — browse topics and messages from the browser (debug only, the
  # pipeline does not depend on it).
  # --------------------------------------------------------------------------
  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: rtp-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_PORT}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    restart: unless-stopped

volumes:
  mongo-data:
  spark-checkpoint:
